---
name: Ruff

on:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install dependencies
        run: uv sync --dev

      # Note: no `ruff format --check` on purpose — the legacy modules predate
      # ruff and a bulk reformat would bury real diffs.
      - name: Run ruff linter
        run: uv run ruff check --output-format=github .
